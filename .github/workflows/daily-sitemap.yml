name: Daily SEO sitemap refresh

on:
  schedule:
    # Runs twice daily (05:15 & 17:15 UTC) to accelerate US/EU & JAV enrichment within quota
    - cron: "15 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-seo-sitemap
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest & US/EU popular videos and refresh catalog state
        run: node scripts/generate-sitemaps.mjs

      - name: Enrich top-priority US/EU videos with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_FALLBACK_MODEL: gemini-3.1-flash-lite
          GEMINI_BATCH_SIZE: 10
        run: node scripts/seo-enrich.mjs --limit 750

      - name: Rebuild static SSR homepage categories, top videos, and schema
        run: node scripts/build-home-ssr.mjs

      - name: Regenerate sitemaps and RSS video feed with newly enriched videos
        run: node scripts/generate-sitemaps.mjs --offline

      - name: Validate sitemap limits, RSS feed, and video metadata
        run: node scripts/validate-sitemaps.mjs

      - name: Commit & push updated SEO catalog, sitemaps, feed, and homepage
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml sitemap_index.xml feed.xml index.html sitemaps data/sitemap-state.json data/enriched-videos.json data/enrich-quota-state.json; then
            echo "No new changes; skipping commit and Vercel deployment."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sitemap.xml sitemap_index.xml feed.xml index.html sitemaps data/sitemap-state.json data/enriched-videos.json data/enrich-quota-state.json
          git commit -m "chore(seo): refresh daily video sitemap, RSS feed, home SSR & enriched metadata"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Submit updated URLs to IndexNow (Bing, DuckDuckGo, Yahoo, Seznam, Yandex)
        run: node scripts/indexnow-submit.mjs
