name: Daily SEO sitemap refresh

on:
  schedule:
    # 11:15 UTC = 18:15 WIB (Menghindari bottleneck antrean GitHub Actions di menit :00)
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-seo-sitemap
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch latest videos and refresh catalog state
        run: node scripts/generate-sitemaps.mjs

      - name: Enrich priority videos with Gemini AI (Phase 5 Pipeline)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_BATCH_SIZE: 5
        run: node scripts/seo-enrich.mjs --limit 100

      - name: Regenerate video sitemaps with newly enriched videos (Phase 5D Gate)
        run: node scripts/generate-sitemaps.mjs --offline

      - name: Validate sitemap limits and required video fields
        run: node scripts/validate-sitemaps.mjs

      - name: Commit only meaningful sitemap & enrichment changes
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml sitemap_index.xml sitemaps data/sitemap-state.json data/enriched-videos.json data/enrich-quota-state.json; then
            echo "No new changes; skipping commit and Vercel deployment."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sitemap.xml sitemap_index.xml sitemaps data/sitemap-state.json data/enriched-videos.json data/enrich-quota-state.json
          git commit -m "chore(seo): refresh daily video sitemap & enriched metadata"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
