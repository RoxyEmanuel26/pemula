        function updateSEO(video) {
            // Dynamic SEO Title strictly 50-60 characters
            let rawTitle = (video.title || 'Untitled').trim();
            const brand = ' | lusthub.my.id';
            let displayTitle = rawTitle;
            if (displayTitle.length + brand.length > 60) {
                displayTitle = displayTitle.slice(0, 60 - brand.length - 3).trim() + '...';
            } else if (displayTitle.length + brand.length < 50 && primaryCat) {
                const ext = ' - ' + primaryCat + ' HD';
                if (displayTitle.length + ext.length + brand.length <= 60) {
                    displayTitle += ext;
                }
            }
            document.title = displayTitle + brand;

            const desc = 'Watch ' + rawTitle + ' in full HD on lusthub.my.id. Stream trending adult videos and viral leaks with fast loading and zero signups required.';
            document.querySelector('meta[name="description"]').setAttribute('content', desc);

            // Open Graph
            document.getElementById('ogTitle').setAttribute('content', video.title);
            document.getElementById('ogDesc').setAttribute('content', desc);
            document.getElementById('ogUrl').setAttribute('content', window.location.href);

            // Twitter Card
            if (document.getElementById('twitterTitle')) {
                document.getElementById('twitterTitle').setAttribute('content', video.title);
            }
            if (document.getElementById('twitterDesc')) {
                document.getElementById('twitterDesc').setAttribute('content', desc);
            }

            // Dynamic Canonical Tag
            let canonicalLink = document.querySelector('link[rel="canonical"]');
            if (!canonicalLink) {
                canonicalLink = document.createElement('link');
                canonicalLink.setAttribute('rel', 'canonical');
                document.head.appendChild(canonicalLink);
            }
            const cleanSlug = (video.title || '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase().substring(0, 80);
            canonicalLink.setAttribute('href', window.location.origin + '/v/' + video.id + '-' + cleanSlug);

            if (video.default_thumb && video.default_thumb.src && isSafeUrl(video.default_thumb.src)) {
                document.getElementById('ogImage').setAttribute('content', video.default_thumb.src);
                if (document.getElementById('twitterImage')) {
                    document.getElementById('twitterImage').setAttribute('content', video.default_thumb.src);
                }
            }

            // Format uploadDate per ISO 8601
            let uploadISO = new Date().toISOString().split('.')[0] + 'Z';
            if (video.added) {
                // e.g. "2024-03-24 16:34:55" -> "2024-03-24T16:34:55Z"
                uploadISO = video.added.replace(' ', 'T');
                if (!uploadISO.includes('Z') && !uploadISO.includes('+')) {
                    uploadISO += 'Z';
                }
            }

            const thumbUrl = (video.default_thumb && video.default_thumb.src && isSafeUrl(video.default_thumb.src)) ? video.default_thumb.src : window.location.origin + '/assets/icons/og-image.png';

            // JSON-LD Schema (Google Rich Results compliant)
            const videoCanonicalUrl = window.location.origin + '/v/' + video.id + '-' + cleanSlug;
            const videoSchema = {
                "@type": "VideoObject",
                "name": video.title,
                "description": desc,
                "thumbnailUrl": [thumbUrl],
                "uploadDate": uploadISO,
                "contentUrl": String(videoCanonicalUrl).replace(/(https?:\/\/)|(\/)+/g, (m, proto) => proto || "/"),
                "isFamilyFriendly": false,
                "publisher": {
                    "@type": "Organization",
                    "name": "lusthub.my.id",
                    "logo": {
                        "@type": "ImageObject",
                        "url": window.location.origin + "/assets/icons/android-chrome-512x512.png"
                    }
                }
            };

            const durationSec = Number(video.length_sec || 0);
            if (durationSec > 0) {
                videoSchema.duration = "PT" + durationSec + "S";
            }
            if (video.embed && isSafeUrl(video.embed)) {
                videoSchema.embedUrl = String(video.embed).replace(/(https?:\/\/)|(\/)+/g, (m, proto) => proto || '/');
            }
            const viewCount = parseInt(String(video.views || "0").replace(/\D/g, '')) || 0;
            if (viewCount > 0) {
                videoSchema.interactionStatistic = {
                    "@type": "InteractionCounter",
                    "interactionType": { "@type": "WatchAction" },
                    "userInteractionCount": viewCount
                };
            }

            let catSlug = 'viral';
            if (video.keywords) {
                const kList = typeof video.keywords === 'string' ? video.keywords.split(',').map(k => k.trim()).filter(Boolean) : video.keywords;
                if (kList.length > 0) catSlug = kList[0].toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            }
            const breadcrumbSchema = {
                "@type": "BreadcrumbList",
                "itemListElement": [
                    {
                        "@type": "ListItem",
                        "position": 1,
                        "name": "Home",
                        "item": window.location.origin + "/"
                    },
                    {
                        "@type": "ListItem",
                        "position": 2,
                        "name": (catSlug.charAt(0).toUpperCase() + catSlug.slice(1)) + " Videos",
                        "item": window.location.origin + "/c/" + catSlug
                    },
                    {
                        "@type": "ListItem",
                        "position": 3,
                        "name": video.title || "Video",
                        "item": window.location.origin + '/v/' + video.id + '-' + cleanSlug
                    }
                ]
            };

            const graphSchema = {
                "@context": "https://schema.org",
                "@graph": [videoSchema, breadcrumbSchema]
            };

            document.getElementById('jsonLdScript').textContent = JSON.stringify(graphSchema);
        }


        async function fetchSimilarVideos(video) {
            try {
                const grid = document.getElementById('similarVideoGrid');
                if (grid && grid.children.length > 0) {
                    document.getElementById('similarVideosSection').style.display = 'block';
                    return;
                }
                let query = 'indonesia';
                if (video.keywords) {
                    const tagArray = typeof video.keywords === 'string' ? video.keywords.split(',').map(t => t.trim()) : video.keywords;
                    if (tagArray.length > 0 && tagArray[0]) query = tagArray[0];
                }

                const response = await fetch('https://www.eporner.com/api/v2/video/search/?query=' + encodeURIComponent(query) + '&per_page=12&format=json');
                if (!response.ok) return;
                const data = await response.json();

                if (data && data.videos && data.videos.length > 0) {
                    document.getElementById('similarVideosSection').style.display = 'block';
                    const grid = document.getElementById('similarVideoGrid');

                    data.videos.forEach(v => {
                        const videoId = String(v.id || '').trim();
                        if (!videoId || videoId === String(video.id || '')) return; // Skip invalid and current videos

                        const title = decodeMojibake(String(v.title || 'Untitled'));
                        const slug = title.replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase().substring(0, 80);
                        const a = document.createElement('a');
                        a.href = '/v/' + encodeURIComponent(videoId) + '-' + slug;
                        a.className = 'card';
                        a.style.textDecoration = 'none';

                        const imageWrap = document.createElement('div');
                        imageWrap.className = 'card-img-wrapper';
                        if (v.length_min) {
                            const duration = document.createElement('span');
                            duration.className = 'badge-duration';
                            duration.textContent = String(v.length_min);
                            imageWrap.appendChild(duration);
                        }
                        if (v.rate) {
                            const rating = document.createElement('span');
                            rating.className = 'badge-rating';
                            rating.textContent = '⭐ ' + String(v.rate);
                            imageWrap.appendChild(rating);
                        }

                        const image = document.createElement('img');
                        const thumb = v.default_thumb && v.default_thumb.src;
                        image.src = isSafeUrl(thumb) ? thumb : '/assets/icons/favicon-32x32.png';
                        image.alt = title;
                        image.loading = 'lazy';
                        image.width = 320;
                        image.height = 180;
                        image.decoding = 'async';
                        image.style.cssText = 'width: 100%; height: 100%; object-fit: cover; border-radius: 8px; aspect-ratio: 16/9;';
                        image.addEventListener('load', () => image.classList.add('loaded'), { once: true });
                        image.addEventListener('error', () => {
                            image.classList.add('loaded');
                            image.style.background = '#333';
                        }, { once: true });
                        imageWrap.appendChild(image);

                        const meta = document.createElement('div');
                        meta.className = 'card-meta';
                        const dateViews = document.createElement('div');
                        dateViews.className = 'card-date-views';
                        const dateLabel = document.createElement('span');
                        dateLabel.style.color = '#aaa';
                        dateLabel.textContent = '📅 ' + String(v.added || '').substring(0, 10);
                        const viewsLabel = document.createElement('span');
                        viewsLabel.style.color = '#aaa';
                        viewsLabel.textContent = '👁 ' + (Number(v.views) || 0).toLocaleString('id-ID');
                        dateViews.append(dateLabel, viewsLabel);

                        const titleLabel = document.createElement('div');
                        titleLabel.className = 'card-title';
                        titleLabel.style.color = '#fff';
                        titleLabel.textContent = title;
                        meta.append(dateViews, titleLabel);
                        a.append(imageWrap, meta);
                        grid.appendChild(a);
                    });
                }
            } catch (err) {
                console.error("Error fetching similar videos:", err);
            }
        }

        function showError(msg) {
            const container = document.getElementById('videoContainer');
            container.innerHTML = '';

            const errDiv = document.createElement('div');
            errDiv.className = 'error-state';

            const h2 = document.createElement('h2');
            h2.textContent = 'Oops!';
            errDiv.appendChild(h2);

            const p = document.createElement('p');
            p.textContent = msg;
            errDiv.appendChild(p);

            const backBtn = document.createElement('a');
            backBtn.href = '/';
            backBtn.className = 'back-btn';
            backBtn.style.marginTop = '20px';
            backBtn.textContent = '← Back to Home';
            errDiv.appendChild(backBtn);

            container.appendChild(errDiv);
        }
